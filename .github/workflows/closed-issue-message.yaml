name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@d0ea8d78a06190da969915d6c21f6c1c09bfcc58 # master
    permissions:
      contents: read
      issues: write
